{{- if .Values.externalSecrets.enabled }}
---
# Agglayer-prover credentials (network private key)
# Currently commented out in deployment.yaml but ready for future use
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "agglayerProver.fullname" . }}-credentials
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agglayerProver.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    kind: {{ .Values.externalSecrets.storeRef.kind }}
    name: {{ .Values.externalSecrets.storeRef.name }}
  
  target:
    name: {{ include "agglayerProver.fullname" . }}-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        networkPrivateKey: "{{ `{{ .networkPrivateKey }}` }}"
  
  dataFrom:
    - extract:
        key: {{ .Values.externalSecrets.awsSecrets.credentials }}
{{- end }}
