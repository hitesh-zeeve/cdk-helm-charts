{{- if .Values.externalSecrets.enabled }}
---
# Shared L1 RPC URL (may be used by multiple components)
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "aggkit.fullname" . }}-shared-l1
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aggkit.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    kind: {{ .Values.externalSecrets.storeRef.kind }}
    name: {{ .Values.externalSecrets.storeRef.name }}
  
  target:
    name: {{ include "aggkit.fullname" . }}-shared-l1
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        l1RpcURL: "{{ `{{ .l1RpcURL }}` }}"
  
  dataFrom:
    - extract:
        key: {{ .Values.externalSecrets.awsSecrets.sharedL1RpcUrl }}

---
# Aggkit credentials (keystore passwords)
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "aggkit.fullname" . }}-credentials
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aggkit.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    kind: {{ .Values.externalSecrets.storeRef.kind }}
    name: {{ .Values.externalSecrets.storeRef.name }}
  
  target:
    name: {{ include "aggkit.fullname" . }}-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        aggsenderKeystorePassword: "{{ `{{ .aggsenderKeystorePassword }}` }}"
        aggsenderValidatorKeystorePassword: "{{ `{{ .aggsenderValidatorKeystorePassword }}` }}"
        aggoracleKeystorePassword: "{{ `{{ .aggoracleKeystorePassword }}` }}"
  
  dataFrom:
    - extract:
        key: {{ .Values.externalSecrets.awsSecrets.credentials }}

---
# Aggkit keystores (binary files)
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "aggkit.fullname" . }}-keystores
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aggkit.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    kind: {{ .Values.externalSecrets.storeRef.kind }}
    name: {{ .Values.externalSecrets.storeRef.name }}
  
  target:
    name: {{ include "aggkit.fullname" . }}-keystores
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: Opaque
      data:
        aggsender.keystore: "{{ `{{ .aggsenderKeystore | b64dec }}` }}"
        aggsenderValidator.keystore: "{{ `{{ .aggsenderValidatorKeystore | b64dec }}` }}"
        aggoracle.keystore: "{{ `{{ .aggoracleKeystore | b64dec }}` }}"
  
  dataFrom:
    - extract:
        key: {{ .Values.externalSecrets.awsSecrets.keystores }}
{{- end }}
