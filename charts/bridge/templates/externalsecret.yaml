{{- if .Values.externalSecrets.enabled }}
---
# Shared L1 RPC URL (may be used by multiple components)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "bridge.fullname" . }}-shared-l1
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bridge.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    kind: {{ .Values.externalSecrets.storeRef.kind }}
    name: {{ .Values.externalSecrets.storeRef.name }}
  
  target:
    name: {{ include "bridge.fullname" . }}-shared-l1
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        l1RpcURL: "{{ `{{ .l1RpcURL }}` }}"
  
  dataFrom:
    - extract:
        key: {{ .Values.externalSecrets.awsSecrets.sharedL1RpcUrl }}

---
# PostgreSQL database credentials (shared across bridge components)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "bridge.fullname" . }}-postgres
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bridge.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    kind: {{ .Values.externalSecrets.storeRef.kind }}
    name: {{ .Values.externalSecrets.storeRef.name }}
  
  target:
    name: {{ include "bridge.fullname" . }}-postgres
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        bridgeDbName: "{{ `{{ .bridgeDbName }}` }}"
        dbUser: "{{ `{{ .dbUser }}` }}"
        dbUserPassword: "{{ `{{ .dbUserPassword }}` }}"
        dbHost: "{{ `{{ .dbHost }}` }}"
        dbPort: "{{ `{{ .dbPort }}` }}"
  
  dataFrom:
    - extract:
        key: {{ .Values.externalSecrets.awsSecrets.postgres }}

---
# Bridge credentials (claim tx keystore password)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "bridge.fullname" . }}-credentials
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bridge.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    kind: {{ .Values.externalSecrets.storeRef.kind }}
    name: {{ .Values.externalSecrets.storeRef.name }}
  
  target:
    name: {{ include "bridge.fullname" . }}-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        claimTxPrivateKeyPassword: "{{ `{{ .claimTxPrivateKeyPassword }}` }}"
  
  dataFrom:
    - extract:
        key: {{ .Values.externalSecrets.awsSecrets.credentials }}

---
# Bridge config (rendered TOML)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "bridge.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bridge.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    kind: {{ .Values.externalSecrets.storeRef.kind }}
    name: {{ .Values.externalSecrets.storeRef.name }}

  target:
    name: {{ include "bridge.fullname" . }}-config
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: Opaque
      data:
        bridge-config.toml: |
          [Log]
          Environment = {{ .Values.config.log.environment | quote }}
          Level = {{ .Values.config.log.level | quote }}
          Outputs = ["stderr"]

          [SyncDB]
          Database = "postgres"
            [SyncDB.PgStorage]
            User = "{{ `{{ .dbUser }}` }}"
            Password = "{{ `{{ .dbUserPassword }}` }}"
            Name = "{{ `{{ .bridgeDbName }}` }}"
            Host = "{{ `{{ .dbHost }}` }}"
            Port = "{{ `{{ .dbPort }}` }}"
            MaxConns = 200

          [Etherman]
          l1URL = "{{ `{{ .l1RpcURL }}` }}"
          L2URLs = [{{ .Values.config.etherman.l2Url | quote }}]

          [Synchronizer]
          SyncInterval = "5s"
          SyncChunkSize = 1000
          ForceL2SyncChunk = {{ .Values.config.synchronizer.forceL2SyncChunk }}

          [BridgeController]
          Store = "postgres"
          Height = 32

          [BridgeServer]
          CacheSize = 100000
          GRPCPort = "9090"
          HTTPPort = "8080"
          DefaultPageLimit = 25
          MaxPageLimit = 100
          BridgeVersion = "v1"
          FinalizedGEREnabled = {{ .Values.config.bridgeServer.finalizedGEREnabled }}

          [BridgeServer.DB]
          Database = "postgres"
            [BridgeServer.DB.PgStorage]
            User = "{{ `{{ .dbUser }}` }}"
            Password = "{{ `{{ .dbUserPassword }}` }}"
            Name = "{{ `{{ .bridgeDbName }}` }}"
            Host = "{{ `{{ .dbHost }}` }}"
            Port = "{{ `{{ .dbPort }}` }}"
            MaxConns = 200

          [NetworkConfig]
          L1GenBlockNumber = {{ .Values.config.network.l1GenBlockNumber | int64 }}
          PolygonBridgeAddress = {{ .Values.config.network.polygonBridgeAddress | quote }}
          PolygonZkEVMGlobalExitRootAddress = {{ .Values.config.network.polygonZkEVMGlobalExitRootAddress | quote }}
          PolygonRollupManagerAddress = {{ .Values.config.network.polygonRollupManagerAddress | quote }}
          PolygonZkEVMAddress = {{ .Values.config.network.polygonZkEVMAddress | quote }}
          L2PolygonBridgeAddresses = [{{ .Values.config.network.l2PolygonBridgeAddress | quote }}]
          L2PolygonZkEVMGlobalExitRootAddresses = [{{ .Values.config.network.l2PolygonZkEVMGlobalExitRootAddress | quote }}]
          L2GenBlockNumbers = [{{ .Values.config.network.l2GenBlockNumbers | int64 }}]
          RequireSovereignChainSmcs = [{{ .Values.config.network.requireSovereignChainSmcs }}]

          [ClaimTxManager]
          FrequencyToMonitorTxs = "5s"
          PrivateKey = {Path = {{ .Values.config.claimTxManager.path | quote }}, Password = "{{ `{{ .claimTxPrivateKeyPassword }}` }}"}
          Enabled = true
          RetryInterval = "1s"
          AreClaimsBetweenL2sEnabled = {{ .Values.config.claimTxManager.areClaimsBetweenL2sEnabled }}

  dataFrom:
    - extract:
        key: {{ .Values.externalSecrets.awsSecrets.sharedL1RpcUrl }}
    - extract:
        key: {{ .Values.externalSecrets.awsSecrets.postgres }}
    - extract:
        key: {{ .Values.externalSecrets.awsSecrets.credentials }}

---
# Bridge keystores (binary files)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "bridge.fullname" . }}-keystores
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bridge.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    kind: {{ .Values.externalSecrets.storeRef.kind }}
    name: {{ .Values.externalSecrets.storeRef.name }}
  
  target:
    name: {{ include "bridge.fullname" . }}-keystores
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: Opaque
      data:
        claimtx.keystore: "{{ `{{ .claimtxKeystore | b64dec }}` }}"
  
  dataFrom:
    - extract:
        key: {{ .Values.externalSecrets.awsSecrets.keystores }}
{{- end }}
