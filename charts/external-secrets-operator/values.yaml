# External Secrets Operator values

# AWS configuration
aws:
  # AWS region where secrets are stored
  region: "us-east-1"

# External Secrets configuration reference
# The External Secrets Operator should be installed separately:
# helm install external-secrets external-secrets/external-secrets -n external-secrets --create-namespace --set installCRDs=true
external-secrets:
  # ServiceAccount configuration (must match the installed operator)
  serviceAccount:
    name: external-secrets-sa
