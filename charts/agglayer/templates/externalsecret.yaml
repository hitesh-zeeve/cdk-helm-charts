{{- if .Values.externalSecrets.enabled }}
---
# Agglayer credentials (keystore password)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "agglayer.fullname" . }}-credentials
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agglayer.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    kind: {{ .Values.externalSecrets.storeRef.kind }}
    name: {{ .Values.externalSecrets.storeRef.name }}
  
  target:
    name: {{ include "agglayer.fullname" . }}-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        aggregatorKeystorePassword: "{{ `{{ .aggregatorKeystorePassword }}` }}"
  
  dataFrom:
    - extract:
        key: {{ .Values.externalSecrets.awsSecrets.credentials }}

---
# Agglayer keystores (binary files)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "agglayer.fullname" . }}-keystores
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agglayer.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    kind: {{ .Values.externalSecrets.storeRef.kind }}
    name: {{ .Values.externalSecrets.storeRef.name }}
  
  target:
    name: {{ include "agglayer.fullname" . }}-keystores
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: Opaque
      data:
        aggregator.keystore: "{{ `{{ .aggregatorKeystore | b64dec }}` }}"
  
  dataFrom:
    - extract:
        key: {{ .Values.externalSecrets.awsSecrets.keystores }}

{{- if and .Values.ingress.enabled (not .Values.tls.existingSecretName) }}
---
# TLS Certificate for Ingress (replaces certificate.yaml Secret)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "agglayer.fullname" . }}-tls
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agglayer.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    kind: {{ .Values.externalSecrets.storeRef.kind }}
    name: {{ .Values.externalSecrets.storeRef.name }}
  
  target:
    name: {{ include "agglayer.fullname" . }}-cloudflare-origin-cert
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: kubernetes.io/tls
      data:
        tls.crt: "{{ `{{ .tlsCrt | b64dec }}` }}"
        tls.key: "{{ `{{ .tlsKey | b64dec }}` }}"
  
  dataFrom:
    - extract:
        key: {{ .Values.externalSecrets.awsSecrets.tls }}
{{- end }}

{{- if and .Values.gke.enabled .Values.gke.backendConfig.enabled }}
---
# OAuth credentials for GKE BackendConfig (replaces secret.yaml Secret)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "agglayer.fullname" . }}-oauth
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agglayer.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    kind: {{ .Values.externalSecrets.storeRef.kind }}
    name: {{ .Values.externalSecrets.storeRef.name }}
  
  target:
    name: {{ include "agglayer.name" . }}-admin-oauth
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: Opaque
      data:
        client_id: "{{ `{{ .clientId }}` }}"
        client_secret: "{{ `{{ .clientSecret }}` }}"
  
  dataFrom:
    - extract:
        key: {{ .Values.externalSecrets.awsSecrets.oauth }}
{{- end }}

{{- if .Values.datadog.enabled }}
---
# Datadog API key
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "agglayer.fullname" . }}-datadog
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agglayer.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    kind: {{ .Values.externalSecrets.storeRef.kind }}
    name: {{ .Values.externalSecrets.storeRef.name }}
  
  target:
    name: {{ include "agglayer.fullname" . }}-datadog
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        api_key: "{{ `{{ .apiKey }}` }}"
  
  dataFrom:
    - extract:
        key: {{ .Values.externalSecrets.awsSecrets.datadog }}
{{- end }}

---
# Agglayer configuration secrets (DATA_NODE_* fields, etc.)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "agglayer.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agglayer.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    kind: {{ .Values.externalSecrets.storeRef.kind }}
    name: {{ .Values.externalSecrets.storeRef.name }}
  
  target:
    name: {{ include "agglayer.fullname" . }}-config
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        DATA_NODE_RPC_HOST: "{{ `{{ .DATA_NODE_RPC_HOST | default \"\" }}` }}"
        DATA_NODE_RPC_PORT: "{{ `{{ .DATA_NODE_RPC_PORT | default \"\" }}` }}"
        DATA_NODE_L1_CHAINID: "{{ `{{ .DATA_NODE_L1_CHAINID | default \"\" }}` }}"
        DATA_NODE_L1_NODEURL: "{{ `{{ .DATA_NODE_L1_NODEURL | default \"\" }}` }}"
        DATA_NODE_L1_NODEURL_WS: "{{ `{{ .DATA_NODE_L1_NODEURL_WS | default \"\" }}` }}"
        DATA_NODE_L1_ROLLUPMANAGERCONTRACT: "{{ `{{ .DATA_NODE_L1_ROLLUPMANAGERCONTRACT | default \"\" }}` }}"
        DATA_NODE_L1_GLOBAL_EXIT_ROOT_CONTRACT: "{{ `{{ .DATA_NODE_L1_GLOBAL_EXIT_ROOT_CONTRACT | default \"\" }}` }}"
        DATA_NODE_KMSKEYNAME: "{{ `{{ .DATA_NODE_KMSKEYNAME | default \"\" }}` }}"
        DATA_NODE_PROJECTID: "{{ `{{ .DATA_NODE_PROJECTID | default \"\" }}` }}"
        DATA_NODE_LOCATION: "{{ `{{ .DATA_NODE_LOCATION | default \"\" }}` }}"
        DATA_NODE_KEYRING: "{{ `{{ .DATA_NODE_KEYRING | default \"\" }}` }}"
        DATA_NODE_KEYNAME: "{{ `{{ .DATA_NODE_KEYNAME | default \"\" }}` }}"
        DATA_NODE_KEYVERSION: "{{ `{{ .DATA_NODE_KEYVERSION | default \"\" }}` }}"
        DATA_NODE_PROOFSIGNERS: "{{ `{{ .DATA_NODE_PROOFSIGNERS | default \"\" }}` }}"
  
  dataFrom:
    - extract:
        key: {{ .Values.externalSecrets.awsSecrets.config }}

---
# Agglayer rendered config.toml (avoid ${...} placeholders)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "agglayer.fullname" . }}-config-toml
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agglayer.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    kind: {{ .Values.externalSecrets.storeRef.kind }}
    name: {{ .Values.externalSecrets.storeRef.name }}
  target:
    name: {{ include "agglayer.fullname" . }}-config-toml
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        config.toml: |
          debug-mode = {{ .Values.config.debugMode }}
          prover-entrypoint = {{ .Values.config.agglayerProverEndpoint | quote }}

          [full-node-rpcs]
          {{ range $key, $value := .Values.config.fullNodeRPCs }}
          {{ $key }} = {{ $value | quote }}
          {{ end }}

          [proof-signers]
          # Intentionally left empty in ExternalSecrets mode.

          [rpc]
          host = "0.0.0.0"
          grpc-port = {{ .Values.ports.grpc }}
          readrpc-port = {{ .Values.ports.readrpc }}
          admin-port = {{ .Values.ports.admin }}
          read-timeout = "60s"
          write-timeout = "60s"
          max-requests-per-ip-and-second = 5000
          request-timeout = "3m"
          max-request-body-size = {{ .Values.config.rpc.maxRequestBodySize | int }}

          [grpc]
          max-decoding-message-size = {{ .Values.config.grpc.maxDecodingMessageSize | int }}
          max-encoding-message-size = {{ .Values.config.grpc.maxEncodingMessageSize | int }}

          [prover.grpc]
          max-decoding-message-size = {{ .Values.config.prover.grpc.maxDecodingMessageSize | int }}
          max-encoding-message-size = {{ .Values.config.prover.grpc.maxEncodingMessageSize | int }}

          [outbound.rpc.settle]
          max-retries = {{ .Values.config.outbound.rpc.settle.maxRetries | int }}
          retry-interval = {{ .Values.config.outbound.rpc.settle.retryInterval | quote }}
          confirmations = {{ .Values.config.outbound.rpc.settle.confirmations | int }}
          settlement-timeout = {{ .Values.config.outbound.rpc.settle.settlementTimeout | quote }}
          gas-multiplier-factor = {{ .Values.config.outbound.rpc.settle.gasMultiplierFactor | int }}

          [outbound.rpc.settle.gas-price]
          multiplier = {{ .Values.config.outbound.rpc.settle.gasPrice.multiplier | float64 }}
          floor = {{ .Values.config.outbound.rpc.settle.gasPrice.floor | quote }}
          ceiling = {{ .Values.config.outbound.rpc.settle.gasPrice.ceiling | quote }}

          [log]
          environment = {{ .Values.config.log.environment | quote }}
          level = {{ .Values.config.log.level | quote }}
          outputs = ["stderr"]
          format = "pretty"

            {{ if .Values.config.gcpkms.enabled }}
          [auth.gcpkms]
          ProjectId = "{{ `{{ .DATA_NODE_PROJECTID | default "" }}` }}"
          Location = "{{ `{{ .DATA_NODE_LOCATION | default "" }}` }}"
          Keyring = "{{ `{{ .DATA_NODE_KEYRING | default "" }}` }}"
          KeyName = "{{ `{{ .DATA_NODE_KEYNAME | default "" }}` }}"
          KeyVersion = {{ `{{ .DATA_NODE_KEYVERSION | default "0" }}` }}
            {{ end }}

            {{ if eq .Values.aggregator.keyName "" }}
          [auth.local]
          private-keys = [
              { path = "/etc/agglayer/{{ .Values.aggregator.keystoreFileName }}", password = "{{ `{{ .aggregatorKeystorePassword }}` }}" },
          ]
            {{ end }}

          [l1]
          chain-id = {{ `{{ .DATA_NODE_L1_CHAINID | default "11155111" }}` }}
          node-url = "{{ `{{ .DATA_NODE_L1_NODEURL | default "" }}` }}"
          ws-node-url = "{{ `{{ .DATA_NODE_L1_NODEURL_WS | default "" }}` }}"
          max-reconnection-elapsed-time = {{ .Values.config.l1.maxReconnectionElapsedTime | quote }}
          rollup-manager-contract = "{{ `{{ .DATA_NODE_L1_ROLLUPMANAGERCONTRACT | default "" }}` }}"
          polygon-zkevm-global-exit-root-v2-contract = "{{ `{{ .DATA_NODE_L1_GLOBAL_EXIT_ROOT_CONTRACT | default "" }}` }}"
          rpc-timeout = "45s"

          [l2]
          rpc-timeout = "45s"

          [telemetry]
          prometheus-addr = "0.0.0.0:2223"

          [rate-limiting]
          send-tx = "unlimited"

          [rate-limiting.network]

          [epoch.block-clock]
          epoch-duration = {{ .Values.config.epoch.blockClock.epochDuration | int }}
          genesis-block = {{ .Values.config.epoch.blockClock.genesisBlock | int }}

          [shutdown]
          runtime-timeout = "5s"

          [certificate-orchestrator]
          input-backpressure-buffer-size = 1000

          [certificate-orchestrator.prover.sp1-local]

          [storage]
          db-path = {{ .Values.storage.path | quote }}

          {{ if ne .Values.backup.type "none" }}
          [storage.backup]
          path = {{ .Values.backup.path | quote }}
          state_max_backup_count = 100
          pending_max_backup_count = 100
          {{ end }}

          {{ if .Values.config.proxiedNetworks }}
          [proxied-networks]
          networks = [{{ join "," .Values.config.proxiedNetworks }}]
          grpc-port = {{ .Values.ports.proxy }}
          host = "0.0.0.0"
          {{ end }}
  dataFrom:
    - extract:
        key: {{ .Values.externalSecrets.awsSecrets.config }}
    - extract:
        key: {{ .Values.externalSecrets.awsSecrets.credentials }}
{{- end }}
