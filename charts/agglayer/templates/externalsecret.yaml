{{- if .Values.externalSecrets.enabled }}
---
# Agglayer credentials (keystore password)
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "agglayer.fullname" . }}-credentials
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agglayer.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    kind: {{ .Values.externalSecrets.storeRef.kind }}
    name: {{ .Values.externalSecrets.storeRef.name }}
  
  target:
    name: {{ include "agglayer.fullname" . }}-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        aggregatorKeystorePassword: "{{ `{{ .aggregatorKeystorePassword }}` }}"
  
  dataFrom:
    - extract:
        key: {{ .Values.externalSecrets.awsSecrets.credentials }}

---
# Agglayer keystores (binary files)
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "agglayer.fullname" . }}-keystores
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agglayer.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    kind: {{ .Values.externalSecrets.storeRef.kind }}
    name: {{ .Values.externalSecrets.storeRef.name }}
  
  target:
    name: {{ include "agglayer.fullname" . }}-keystores
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: Opaque
      data:
        aggregator.keystore: "{{ `{{ .aggregatorKeystore | b64dec }}` }}"
  
  dataFrom:
    - extract:
        key: {{ .Values.externalSecrets.awsSecrets.keystores }}

{{- if and .Values.ingress.enabled (not .Values.tls.existingSecretName) }}
---
# TLS Certificate for Ingress (replaces certificate.yaml Secret)
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "agglayer.fullname" . }}-tls
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agglayer.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    kind: {{ .Values.externalSecrets.storeRef.kind }}
    name: {{ .Values.externalSecrets.storeRef.name }}
  
  target:
    name: {{ include "agglayer.fullname" . }}-cloudflare-origin-cert
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: kubernetes.io/tls
      data:
        tls.crt: "{{ `{{ .tlsCrt | b64dec }}` }}"
        tls.key: "{{ `{{ .tlsKey | b64dec }}` }}"
  
  dataFrom:
    - extract:
        key: {{ .Values.externalSecrets.awsSecrets.tls }}
{{- end }}

{{- if and .Values.gke.enabled .Values.gke.backendConfig.enabled }}
---
# OAuth credentials for GKE BackendConfig (replaces secret.yaml Secret)
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "agglayer.fullname" . }}-oauth
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agglayer.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    kind: {{ .Values.externalSecrets.storeRef.kind }}
    name: {{ .Values.externalSecrets.storeRef.name }}
  
  target:
    name: {{ include "agglayer.name" . }}-admin-oauth
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: Opaque
      data:
        client_id: "{{ `{{ .clientId }}` }}"
        client_secret: "{{ `{{ .clientSecret }}` }}"
  
  dataFrom:
    - extract:
        key: {{ .Values.externalSecrets.awsSecrets.oauth }}
{{- end }}

{{- if .Values.datadog.enabled }}
---
# Datadog API key
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "agglayer.fullname" . }}-datadog
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agglayer.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    kind: {{ .Values.externalSecrets.storeRef.kind }}
    name: {{ .Values.externalSecrets.storeRef.name }}
  
  target:
    name: {{ include "agglayer.fullname" . }}-datadog
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        api_key: "{{ `{{ .apiKey }}` }}"
  
  dataFrom:
    - extract:
        key: {{ .Values.externalSecrets.awsSecrets.datadog }}
{{- end }}

---
# Agglayer configuration secrets (DATA_NODE_* fields, etc.)
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "agglayer.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agglayer.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    kind: {{ .Values.externalSecrets.storeRef.kind }}
    name: {{ .Values.externalSecrets.storeRef.name }}
  
  target:
    name: {{ include "agglayer.fullname" . }}-config
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        DATA_NODE_RPC_HOST: "{{ `{{ .DATA_NODE_RPC_HOST | default "" }}` }}"
        DATA_NODE_RPC_PORT: "{{ `{{ .DATA_NODE_RPC_PORT | default "" }}` }}"
        DATA_NODE_L1_CHAINID: "{{ `{{ .DATA_NODE_L1_CHAINID | default "" }}` }}"
        DATA_NODE_L1_NODEURL: "{{ `{{ .DATA_NODE_L1_NODEURL | default "" }}` }}"
        DATA_NODE_L1_NODEURL_WS: "{{ `{{ .DATA_NODE_L1_NODEURL_WS | default "" }}` }}"
        DATA_NODE_L1_ROLLUPMANAGERCONTRACT: "{{ `{{ .DATA_NODE_L1_ROLLUPMANAGERCONTRACT | default "" }}` }}"
        DATA_NODE_L1_GLOBAL_EXIT_ROOT_CONTRACT: "{{ `{{ .DATA_NODE_L1_GLOBAL_EXIT_ROOT_CONTRACT | default "" }}` }}"
        DATA_NODE_KMSKEYNAME: "{{ `{{ .DATA_NODE_KMSKEYNAME | default "" }}` }}"
        DATA_NODE_PROJECTID: "{{ `{{ .DATA_NODE_PROJECTID | default "" }}` }}"
        DATA_NODE_LOCATION: "{{ `{{ .DATA_NODE_LOCATION | default "" }}` }}"
        DATA_NODE_KEYRING: "{{ `{{ .DATA_NODE_KEYRING | default "" }}` }}"
        DATA_NODE_KEYNAME: "{{ `{{ .DATA_NODE_KEYNAME | default "" }}` }}"
        DATA_NODE_KEYVERSION: "{{ `{{ .DATA_NODE_KEYVERSION | default "" }}` }}"
        DATA_NODE_PROOFSIGNERS: "{{ `{{ .DATA_NODE_PROOFSIGNERS | default "" }}` }}"
  
  dataFrom:
    - extract:
        key: {{ .Values.externalSecrets.awsSecrets.config }}
{{- end }}
