{{- if .Values.storageClass.create }}
kind: StorageClass
apiVersion: storage.k8s.io/v1
metadata:
  name: {{ default (include "agglayer.fullname" .) .Values.storageClass.name }}
provisioner: {{ .Values.storageClass.provisioner | quote }}
allowVolumeExpansion: {{ .Values.storageClass.allowVolumeExpansion }}
{{- with .Values.storageClass.parameters }}
parameters:
  {{- toYaml . | nindent 2 }}
{{- end }}
volumeBindingMode: {{ .Values.storageClass.volumeBindingMode | quote }}
{{- end }}