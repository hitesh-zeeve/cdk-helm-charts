env: bali

podLabels:
  name: agglayer
  business_unit: agglayer
  role: agglayer-node
  partner: Polygon

image:
  repository: ghcr.io/agglayer/agglayer
  pullPolicy: IfNotPresent
  tag: 0.4.4

ports:
  grpc: 9089
  readrpc: 9090
  admin: 9091
  proxy: 9092
  telemetry: 2223

existingSecret: op-secrets

aggregator:
  # If keyName is empty, agglayer will use keystore file from Secret
  # If keyName is set, agglayer will use GCP KMS (controlled by config.gcpkms.enabled)
  keyName: ""
  keystoreFileName: "aggregator.keystore"
  keystorePasswordSecretFieldName: "aggregatorKeystorePassword"

domain: agglayer-test.polygon.technology
createMigrationService: true

# Platform toggles
gke:
  enabled: true
  backendConfig:
    enabled: true
  neg:
    enabled: true

datadog:
  enabled: true

tls:
  createSecret: true
  # If set, the chart will reference this secret and will NOT create one.
  existingSecretName: ""
  base64Cert: ""
  base64Key: ""

ingress:
  enabled: true
  # For private/internal-only deployments set enabled=false.
  # className is used for Ingress.spec.ingressClassName.
  classNameApp: gce
  classNameGrpc: nginx
  nginxProxyBodySize: 10m

config:
  agglayerProverEndpoint: http://localhost:4445
  debugMode: false

  gcpkms:
    # Set false for private/local clusters (no GCP KMS)
    enabled: true

  epoch:
    blockClock:
      epochDuration: 50
      genesisBlock: 1

  proxiedNetworks:
    #- 1 # Commented out to avoid having it prepended to the list

  fullNodeRPCs:
    # 1: "http://localhost:8123" # Commented out to avoid having it prepended to the list

  l1:
    maxReconnectionElapsedTime: "10s"

  log:
    environment: development
    level: info

  outbound:
    rpc:
      settle:
        gasMultiplierFactor: 130
        maxRetries: 3
        retryInterval: "60s"
        confirmations: 1
        settlementTimeout: "20m"
        gasPrice:
          multiplier: 1.5
          floor: "1gwei"
          ceiling: "100gwei"

  rpc:
    maxRequestBodySize: 10485760 # 10MB

  grpc:
    maxDecodingMessageSize: 10485760 # 10MB
    maxEncodingMessageSize: 10485760 # 10MB

  prover:
    grpc:
      maxDecodingMessageSize: 10485760 # 10MB
      maxEncodingMessageSize: 10485760 # 10MB

command: agglayer run --cfg /etc/agglayer/config.toml

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations:
    # GCP IAM Service Account to impersonate (provides
    iam.gke.io/gcp-service-account: agglayer-gke-dev@prj-polygonlabs-shared-dev.iam.gserviceaccount.com
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

storage:
  # Persistence mode:
  # - pvc: (default) uses a PVC created by the StatefulSet volumeClaimTemplates
  # - hostPath: mounts a directory from the node filesystem (good for quick testing; single replica)
  type: pvc
  path: /etc/agglayer/data
  size: 1Ti
  # If set, used as PVC storageClassName. If empty, defaults to chart fullname.
  storageClassName: ""
  # Used when storage.type=hostPath
  hostPath: /var/lib/agglayer/data

storageClass:
  # Creates a StorageClass named after the release (or override name below).
  # For non-GKE clusters you usually want create=false and set storage.storageClassName instead.
  create: true
  name: "" # default: chart fullname
  provisioner: pd.csi.storage.gke.io
  allowVolumeExpansion: true
  volumeBindingMode: WaitForFirstConsumer
  parameters:
    type: pd-ssd
    replication-type: regional-pd

backup:
  # Backup volume type:
  # - gcsfuse: creates a PV/PVC backed by a GCS bucket (GKE-specific)
  # - pvc: creates a regular PVC (cluster-local / storageClass-backed)
  # - hostPath: mounts a directory from the node filesystem
  # - none: disables backup volume and omits [storage.backup] config
  type: gcsfuse
  path: /backup
  bucket: "bucket_name"
  size: 1Ti
  # Used when backup.type=hostPath
  hostPath: /var/lib/agglayer/backup
  pvc:
    storageClassName: ""
    accessModes:
      - ReadWriteOnce

# Scheduling defaults (previously hardcoded in the template)
nodeSelector:
  group: "agglayer"

tolerations:
  - key: group
    operator: Equal
    value: "agglayer"
    effect: NoSchedule

resources:
  limits:
    cpu: 4
    memory: 16Gi
  requests:
    cpu: 1
    memory: 4Gi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80
