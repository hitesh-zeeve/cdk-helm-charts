{{- $l1RpcURL := "" }}
{{- if not .Values.externalSecrets.enabled }}
{{- $opSecrets := (lookup "v1" "Secret" .Release.Namespace "op-secrets") }}
{{- if $opSecrets.data }}
    {{- if (index $opSecrets.data "l1RpcURL") }}
        {{- $l1RpcURL = index $opSecrets.data "l1RpcURL" | b64dec }}
    {{- end }}
{{- end }}
{{- end }}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "bridgeUI.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bridgeUI.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "bridgeUI.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "bridgeUI.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.container.image.repository }}:{{ .Values.container.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.container.image.pullPolicy }}
          ports:
            - name: app
              containerPort: {{ .Values.container.ports.app }}
              protocol: TCP
          env:
            # Ethereum L1 Configuration
            - name: ETHEREUM_RPC_URL
              {{- if .Values.externalSecrets.enabled }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "bridgeUI.fullname" . }}-shared-l1
                  key: l1RpcURL
              {{- else }}
              value: {{ $l1RpcURL | quote }}
              {{- end }}
            - name: ETHEREUM_EXPLORER_URL
              value: {{ .Values.container.env.ethereumExplorerUrl | quote }}
            - name: ETHEREUM_BRIDGE_CONTRACT_ADDRESS
              value: {{ .Values.container.env.ethereumBridgeContractAddress | quote }}
            - name: ETHEREUM_FORCE_UPDATE_GLOBAL_EXIT_ROOT
              value: {{ .Values.container.env.ethereumForceUpdateGlobalExitRoot | quote }}
            - name: ETHEREUM_PROOF_OF_EFFICIENCY_CONTRACT_ADDRESS
              value: {{ .Values.container.env.ethereumProofOfEfficiencyContractAddress | quote }}
            - name: ETHEREUM_ROLLUP_MANAGER_ADDRESS
              value: {{ .Values.container.env.ethereumRollupManagerAddress | quote }}
            # Polygon zkEVM L2 Configuration
            - name: POLYGON_ZK_EVM_RPC_URL
              value: {{ .Values.container.env.polygonZkEvmRpcUrl | quote }}
            - name: POLYGON_ZK_EVM_EXPLORER_URL
              value: {{ .Values.container.env.polygonZkEvmExplorerUrl | quote }}
            - name: POLYGON_ZK_EVM_BRIDGE_CONTRACT_ADDRESS
              value: {{ .Values.container.env.polygonZkEvmBridgeContractAddress | quote }}
            - name: POLYGON_ZK_EVM_NETWORK_ID
              value: {{ .Values.container.env.polygonZkEvmNetworkId | quote }}
            {{- if .Values.container.env.polygonZkEvmNativeGasToken }}
            - name: POLYGON_ZK_EVM_NATIVE_GAS_TOKEN
              value: {{ .Values.container.env.polygonZkEvmNativeGasToken | quote }}
            {{- end }}
            {{- if .Values.container.env.polygonZkEvmNativeGasTokenAddress }}
            - name: POLYGON_ZK_EVM_NATIVE_GAS_TOKEN_ADDRESS
              value: {{ .Values.container.env.polygonZkEvmNativeGasTokenAddress | quote }}
            {{- end }}
            {{- if .Values.container.env.polygonZkEvmWethTokenAddress }}
            - name: POLYGON_ZK_EVM_WETH_TOKEN_ADDRESS
              value: {{ .Values.container.env.polygonZkEvmWethTokenAddress | quote }}
            {{- end }}
            # Bridge API
            - name: BRIDGE_API_URL
              value: {{ .Values.container.env.bridgeApiUrl | quote }}
            # Feature Flags
            - name: ENABLE_FIAT_EXCHANGE_RATES
              value: {{ .Values.container.env.enableFiatExchangeRates | quote }}
            - name: ENABLE_OUTDATED_NETWORK_MODAL
              value: {{ .Values.container.env.enableOutdatedNetworkModal | quote }}
            - name: ENABLE_DEPOSIT_WARNING
              value: {{ .Values.container.env.enableDepositWarning | quote }}
            - name: ENABLE_REPORT_FORM
              value: {{ .Values.container.env.enableReportForm | quote }}
            {{- if .Values.container.env.enableDepositLimits }}
            - name: ENABLE_DEPOSIT_LIMITS
              value: {{ .Values.container.env.enableDepositLimits | quote }}
            {{- end }}
            # Vite Build Configuration
            - name: VITE_RESOLVE_RELATIVE_URLS
              value: {{ .Values.container.env.viteResolveRelativeUrls | default "false" | quote }}
            - name: VITE_CUSTOMIZATION
              value: {{ .Values.container.env.viteCustomization | default "" | quote }}
            - name: VITE_NAME
              value: {{ .Values.container.env.viteName | default "" | quote }}
            - name: VITE_APP_FAVICON
              value: {{ .Values.container.env.viteAppFavicon | default "" | quote }}
            - name: VITE_APP_TITLE
              value: {{ .Values.container.env.viteAppTitle | default "" | quote }}
            - name: VITE_TOKEN_NAME
              value: {{ .Values.container.env.viteTokenName | default "" | quote }}
            - name: VITE_TOKEN_SYMBOL
              value: {{ .Values.container.env.viteTokenSymbol | default "" | quote }}
            - name: VITE_TOKEN_DECIMAL
              value: {{ .Values.container.env.viteTokenDecimal | default "" | quote }}
            # Legacy compatibility
            {{- if .Values.container.env.zkEvmNetworkConfigPolygonZkEvmGlobalExitRootAddress }}
            - name: ZKEVM_NETWORKCONFIG_POLYGONZKEVMGLOBALEXITROOTADDRESS
              value: {{ .Values.container.env.zkEvmNetworkConfigPolygonZkEvmGlobalExitRootAddress | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
