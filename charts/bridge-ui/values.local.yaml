# Local development values
# Usage: helm install bridge-ui ./charts/bridge-ui -f charts/bridge-ui/values.local.yaml
#
# For local access, you have 3 options:
#
# Option 1 - Port Forward (simplest, no ingress needed):
#   kubectl port-forward svc/bridge-ui 8080:80
#   Access at: http://localhost:8080
#
# Option 2 - NodePort (no ingress controller needed):
#   Set service.type to NodePort below
#   Access at: http://<node-ip>:<nodeport>
#
# Option 3 - Ingress (requires nginx ingress controller installed):
#   Install controller first:
#   kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.8.1/deploy/static/provider/cloud/deploy.yaml
#   Then set ingress.enabled to true below

env: local

podLabels:
  name: bridge-ui
  business_unit: agglayer
  role: bridge-ui
  partner: Polygon
  network: local

container:
  image:
    repository: ghcr.io/0xpolygon/zkevm-bridge-ui
    pullPolicy: IfNotPresent
    tag: multi-network

  ports:
    app: 80

  env:
    # Ethereum L1 Configuration
    ethereumRpcUrl: ""
    ethereumExplorerUrl: "https://sepolia.etherscan.io"
    ethereumBridgeContractAddress: ""
    ethereumForceUpdateGlobalExitRoot: true
    ethereumProofOfEfficiencyContractAddress: ""
    ethereumRollupManagerAddress: ""
    
    # Polygon zkEVM L2 Configuration
    polygonZkEvmRpcUrl: "http://cdk-erigon-rpc:8123"
    polygonZkEvmExplorerUrl: ""
    polygonZkEvmBridgeContractAddress: ""
    polygonZkEvmNetworkId: ""
    # polygonZkEvmNativeGasToken: true
    # polygonZkEvmNativeGasTokenAddress: ""
    # polygonZkEvmWethTokenAddress: ""
    
    # Bridge API
    bridgeApiUrl: ""
    
    # Feature Flags
    enableFiatExchangeRates: false
    enableOutdatedNetworkModal: false
    enableDepositWarning: true
    enableReportForm: false
    # enableDepositLimits: true
    
    # Legacy compatibility
    zkEvmNetworkConfigPolygonZkEvmGlobalExitRootAddress: ""
    
    # Vite Build Configuration (optional for custom branding)
    # viteResolveRelativeUrls: false
    # viteCustomization: ''
    # viteName: ""
    # viteAppFavicon: ""
    # viteAppTitle: ""
    # viteTokenName: ""
    # viteTokenSymbol: ""
    # viteTokenDecimal: ""

ingress:
  enabled: false  # Disabled by default for local - use port-forward or NodePort instead
  hostname: ""  # No hostname for local development
  annotations:
    kubernetes.io/ingress.class: nginx  # Requires nginx ingress controller to be installed
  tls:
    enabled: false  # Disable TLS for local development

# For local access without ingress controller, you can use NodePort:
# Uncomment the lines below to enable NodePort service
service:
  type: NodePort
  nodePort: 30080  # Access via http://<node-ip>:30080

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

podSecurityContext: {}

securityContext: {}

resources:
  limits:
    cpu: 2
    memory: 4Gi
  requests:
    cpu: 500m
    memory: 1Gi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80
