# Local development values
# Usage: helm install bridge-ui ./charts/bridge-ui -f charts/bridge-ui/values.local.yaml
#
# For local access, you have 3 options:
#
# Option 1 - Port Forward (simplest, no ingress needed):
#   kubectl port-forward svc/bridge-ui 8080:80
#   Access at: http://localhost:8080
#
# Option 2 - NodePort (no ingress controller needed):
#   Set service.type to NodePort below
#   Access at: http://<node-ip>:<nodeport>
#
# Option 3 - Ingress (requires nginx ingress controller installed):
#   Install controller first:
#   kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.8.1/deploy/static/provider/cloud/deploy.yaml
#   Then set ingress.enabled to true below

env: local

podLabels:
  name: bridge-ui
  business_unit: agglayer
  role: bridge-ui
  partner: Polygon
  network: local

container:
  image:
    repository: priyanshu55/kinexys-bridge
    pullPolicy: IfNotPresent
    tag: 1.2.0

  ports:
    app: 80

  env:
    # Ethereum L1 Configuration
    ethereumRpcUrl: "https://bridge.kinexys.zeeve.net/l1"
    ethereumExplorerUrl: "https://reth.explorer.zeeve.net/"
    ethereumBridgeContractAddress: "0xbE31765BBD2cf1cb7018F6D047ffC02cbd727f59"
    ethereumForceUpdateGlobalExitRoot: true
    ethereumProofOfEfficiencyContractAddress: "0x603C86D91ca3085D7BcFF099533A8835692E65BE"
    ethereumRollupManagerAddress: "0xbD2CC252599B1216EE5a202ce1fD2e19835739a0"
    
    # Polygon zkEVM L2 Configuration
    polygonZkEvmRpcUrl: "https://rpc.kinexys.zeeve.net"
    polygonZkEvmExplorerUrl: "https://explorer.kinexys.zeeve.net/"
    polygonZkEvmBridgeContractAddress: "0xbE31765BBD2cf1cb7018F6D047ffC02cbd727f59"
    polygonZkEvmNetworkId: "3"
    # polygonZkEvmNativeGasToken: true
    # polygonZkEvmNativeGasTokenAddress: ""
    # polygonZkEvmWethTokenAddress: ""
    
    # Bridge API
    bridgeApiUrl: "https://bridge.kinexys.zeeve.net/service"
    
    # Feature Flags
    enableFiatExchangeRates: false
    enableOutdatedNetworkModal: false
    enableDepositWarning: true
    enableReportForm: false
    # enableDepositLimits: true
    
    # Legacy compatibility
    zkEvmNetworkConfigPolygonZkEvmGlobalExitRootAddress: "0x9d35296Df31AD86cF1e7e6b39100396328511522"
    
    # Vite Build Configuration (optional for custom branding)
    # viteResolveRelativeUrls: false
    VITE_CUSTOMIZATION: '{"brand": {"name": "JPMC", "theme": {"primary": "#010214", "secondary": "#FFFFFF"}, "favicon": "https://f005.backblazeb2.com/file/tracehawk-prod/logo/Ternoa/Favicon.png", "logo": {"light": "https://f005.backblazeb2.com/file/tracehawk-prod/logo/Ternoa/Dark.png", "dark": "https://f005.backblazeb2.com/file/tracehawk-prod/logo/Ternoa/Dark.png"}}}'
    VITE_NAME: "JPMC Bridge"
    VITE_APP_FAVICON: "https://f005.backblazeb2.com/file/tracehawk-prod/logo/Ternoa/Favicon.png"
    VITE_APP_TITLE: "JPMC Bridge"
    VITE_TOKEN_NAME: "ETH"
    VITE_TOKEN_SYMBOL: "ETH"
    VITE_TOKEN_DECIMAL: "18"

ingress:
  enabled: false  # Disabled by default for local - use port-forward or NodePort instead
  hostname: ""  # No hostname for local development
  annotations:
    kubernetes.io/ingress.class: nginx  # Requires nginx ingress controller to be installed
  tls:
    enabled: false  # Disable TLS for local development

# For local access without ingress controller, you can use NodePort:
# Uncomment the lines below to enable NodePort service
service:
  type: NodePort
  nodePort: 30080  # Access via http://<node-ip>:30080

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

podSecurityContext: {}

securityContext: {}

resources:
  limits:
    cpu: 2
    memory: 4Gi
  requests:
    cpu: 500m
    memory: 1Gi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80
