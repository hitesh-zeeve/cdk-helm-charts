# External Secrets Operator configuration
externalSecrets:
  enabled: true
  refreshInterval: 1h
  storeRef:
    kind: ClusterSecretStore
    name: aws-secretsmanager
  awsSecrets:
    # Shared L1 RPC URL used across multiple components
    sharedL1RpcUrl: "/dev/cdk-agglayer/shared/l1-rpc-url"

env: bali

podLabels:
  name: myname
  business_unit: agglayer
  role: myrole
  partner: Polygon
  network: mynetwork

container:
  image:
    repository: ghcr.io/0xpolygon/zkevm-bridge-ui
    pullPolicy: IfNotPresent
    tag: multi-network

  ports:
    app: 80

  env:
    # Ethereum L1 Configuration
    ethereumRpcUrl: ""
    ethereumExplorerUrl: "https://sepolia.etherscan.io"
    ethereumBridgeContractAddress: ""
    ethereumForceUpdateGlobalExitRoot: true
    ethereumProofOfEfficiencyContractAddress: ""
    ethereumRollupManagerAddress: ""
    
    # Polygon zkEVM L2 Configuration
    polygonZkEvmRpcUrl: "http://cdk-erigon-rpc:8123"
    polygonZkEvmExplorerUrl: ""
    polygonZkEvmBridgeContractAddress: ""
    polygonZkEvmNetworkId: ""
    # polygonZkEvmNativeGasToken: true
    # polygonZkEvmNativeGasTokenAddress: ""
    # polygonZkEvmWethTokenAddress: ""
    
    # Bridge API
    bridgeApiUrl: ""
    
    # Feature Flags
    enableFiatExchangeRates: false
    enableOutdatedNetworkModal: false
    enableDepositWarning: true
    enableReportForm: false
    enableDepositLimits: true
    
    # Legacy compatibility
    zkEvmNetworkConfigPolygonZkEvmGlobalExitRootAddress: ""
    
    # Vite Build Configuration (optional for custom branding)
    # viteResolveRelativeUrls: false
    # viteCustomization: ''
    # viteName: ""
    # viteAppFavicon: ""
    # viteAppTitle: ""
    # viteTokenName: ""
    # viteTokenSymbol: ""
    # viteTokenDecimal: ""

ingress:
  enabled: true
  hostname: ""  # Leave empty for local development without DNS
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # For local development with nginx ingress controller:
    # kubernetes.io/ingress.class: nginx
    # For GCP with cert-manager (production):
    # cert-manager.io/issuer: gcp-cas-issuer
    # cert-manager.io/issuer-kind: GoogleCASClusterIssuer
    # cert-manager.io/issuer-group: cas-issuer.jetstack.io
    # kubernetes.io/ingress.class: "gce-internal"
    # kubernetes.io/ingress.allow-http: "false"
    # external-dns.alpha.kubernetes.io/hostname: something.dev.polygon
  tls:
    enabled: false  # Set to true for production with certificates

service:
  type: ClusterIP  # ClusterIP, NodePort, or LoadBalancer
  # nodePort: 30080  # Only used when type is NodePort

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

resources:
  limits:
    cpu: 4
    memory: 8Gi
  requests:
    cpu: 1
    memory: 4Gi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80
