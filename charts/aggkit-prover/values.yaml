# External Secrets Operator configuration
externalSecrets:
  enabled: true
  refreshInterval: 1h
  storeRef:
    kind: ClusterSecretStore
    name: aws-secretsmanager
  awsSecrets:
    # Shared L1 RPC URL used across multiple components
    sharedL1RpcUrl: "/dev/cdk-agglayer/shared/l1-rpc-url"
    # Aggkit-prover specific credentials (SP1 network private key and RPC URL)
    credentials: "/dev/cdk-agglayer/aggkit-prover/credentials"

replicaCount: 1

image:
  repository: ghcr.io/md-tosif/aggkit-prover
  pullPolicy: IfNotPresent
  tag: 1.8.0
  command: ["/usr/local/bin/aggkit-prover"]
  args: ["run", "--config-path", "/etc/aggkit/aggkit-prover-config.toml"]

existingSecret: op-secrets

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

datadir:
  path: /data
  size: 500Gi

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

config:
  networkId: 0
  l2ExecutionLayerRpcEndpoint: "http://op-succinct-sequencer.op-succinct.svc.cluster.local:8545"
  l2ConsensusLayerRpcEndpoint: "http://op-succinct-sequencer.op-succinct.svc.cluster.local:9545"
  mock: false
  polygonRollupManager: "0x0000000000000000000000000000000000000000"
  globalExitRootManagerV2SovereignChain: "0x0000000000000000000000000000000000000000"
  proposerEndpoint: "http://op-succinct-proposer.op-succinct.svc.cluster.local:50051"
  genesis: |
    {}

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
securityContext: {}

service:
  type: ClusterIP
  port: 4446

resources:
  limits:
    cpu: 2
    memory: 8Gi
  requests:
    cpu: 1
    memory: 4Gi
