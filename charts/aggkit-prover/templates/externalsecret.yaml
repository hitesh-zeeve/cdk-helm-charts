{{- if .Values.externalSecrets.enabled }}
---
# Shared L1 RPC URL (may be used by multiple components)
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "aggkit-prover.fullname" . }}-shared-l1
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aggkit-prover.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    kind: {{ .Values.externalSecrets.storeRef.kind }}
    name: {{ .Values.externalSecrets.storeRef.name }}
  
  target:
    name: {{ include "aggkit-prover.fullname" . }}-shared-l1
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        l1RpcURL: "{{ `{{ .l1RpcURL }}` }}"
  
  dataFrom:
    - extract:
        key: {{ .Values.externalSecrets.awsSecrets.sharedL1RpcUrl }}

---
# Aggkit-prover credentials (SP1 private key and RPC URL)
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "aggkit-prover.fullname" . }}-credentials
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aggkit-prover.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    kind: {{ .Values.externalSecrets.storeRef.kind }}
    name: {{ .Values.externalSecrets.storeRef.name }}
  
  target:
    name: {{ include "aggkit-prover.fullname" . }}-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        sp1NetworkPrivateKey: "{{ `{{ .sp1NetworkPrivateKey }}` }}"
        sp1NetworkRpcURL: "{{ `{{ .sp1NetworkRpcURL }}` }}"
  
  dataFrom:
    - extract:
        key: {{ .Values.externalSecrets.awsSecrets.credentials }}
{{- end }}
