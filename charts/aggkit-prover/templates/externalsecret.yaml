{{- if .Values.externalSecrets.enabled }}
---
# Shared L1 RPC URL (may be used by multiple components)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "aggkit-prover.fullname" . }}-shared-l1
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aggkit-prover.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    kind: {{ .Values.externalSecrets.storeRef.kind }}
    name: {{ .Values.externalSecrets.storeRef.name }}
  
  target:
    name: {{ include "aggkit-prover.fullname" . }}-shared-l1
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        l1RpcURL: "{{ `{{ .l1RpcURL }}` }}"
  
  dataFrom:
    - extract:
        key: {{ .Values.externalSecrets.awsSecrets.sharedL1RpcUrl }}

---
# Aggkit-prover credentials (SP1 private key and RPC URL)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "aggkit-prover.fullname" . }}-credentials
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aggkit-prover.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    kind: {{ .Values.externalSecrets.storeRef.kind }}
    name: {{ .Values.externalSecrets.storeRef.name }}
  
  target:
    name: {{ include "aggkit-prover.fullname" . }}-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        sp1NetworkPrivateKey: "{{ `{{ .sp1NetworkPrivateKey }}` }}"
        sp1NetworkRpcURL: "{{ `{{ .sp1NetworkRpcURL }}` }}"
  
  dataFrom:
    - extract:
        key: {{ .Values.externalSecrets.awsSecrets.credentials }}

---
# Aggkit-prover rendered config (avoid ${...} placeholders)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "aggkit-prover.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aggkit-prover.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    kind: {{ .Values.externalSecrets.storeRef.kind }}
    name: {{ .Values.externalSecrets.storeRef.name }}
  target:
    name: {{ include "aggkit-prover.fullname" . }}-config
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        aggkit-prover-config.toml: |
          grpc-endpoint = "0.0.0.0:4446"

          [log]
          level = "debug"
          outputs = []
          format = "pretty"

          [telemetry]
          prometheus-addr = "0.0.0.0:9090"

          [shutdown]
          runtime-timeout = "5s"

          [aggchain-proof-service.aggchain-proof-builder]
          network-id = {{ .Values.config.networkId | int }}
          proving-timeout = "1h"

          [aggchain-proof-service.aggchain-proof-builder.primary-prover.network-prover]
          sp1-cluster-endpoint = "{{ `{{ .sp1NetworkRpcURL }}` }}"
          proving-timeout = "1h"

          [aggchain-proof-service.aggchain-proof-builder.contracts]
          l1-rpc-endpoint = "{{ `{{ .l1RpcURL }}` }}"
          l2-execution-layer-rpc-endpoint = {{ .Values.config.l2ExecutionLayerRpcEndpoint | quote }}
          l2-consensus-layer-rpc-endpoint = {{ .Values.config.l2ConsensusLayerRpcEndpoint | quote }}
          polygon-rollup-manager = {{ .Values.config.polygonRollupManager | quote }}
          global-exit-root-manager-v2-sovereign-chain = {{ .Values.config.globalExitRootManagerV2SovereignChain | quote }}
          evm-sketch-genesis="/etc/aggkit/genesis.json"

          [aggchain-proof-service.proposer-service]
          l1-rpc-endpoint = "{{ `{{ .l1RpcURL }}` }}"
          mock = {{ .Values.config.mock }}

          [aggchain-proof-service.proposer-service.client]
          proposer-endpoint = {{ .Values.config.proposerEndpoint | quote }}
          sp1-cluster-endpoint = "{{ `{{ .sp1NetworkRpcURL }}` }}"
          request-timeout = 3600
          proving-timeout = 3600

          [primary-prover.network-prover]
          proving-timeout = "1h"
          sp1-cluster-endpoint = "{{ `{{ .sp1NetworkRpcURL }}` }}"
  dataFrom:
    - extract:
        key: {{ .Values.externalSecrets.awsSecrets.sharedL1RpcUrl }}
    - extract:
        key: {{ .Values.externalSecrets.awsSecrets.credentials }}
{{- end }}
